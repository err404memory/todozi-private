<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todozi Manage</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="shell-header">
        <div class="title-row">
          <div>
            <p class="eyebrow">Todozi [v]</p>
            <h1>Todozi manage</h1>
          </div>
          <div class="hero-actions">
            <button id="refresh-btn" class="secondary">Refresh</button>
            <a class="ghost" href="/api/health" target="_blank" rel="noreferrer">Health</a>
          </div>
        </div>
        <nav class="modebar" aria-label="Todozi sections">
          <button type="button" class="mode-tab active" data-mode="projects">📁 Projects</button>
          <button type="button" class="mode-tab" data-mode="tasks">📋 Tasks</button>
          <button type="button" class="mode-tab" data-mode="done">✅ Done</button>
          <button type="button" class="mode-tab" data-mode="find">🔍 Find</button>
          <button type="button" class="mode-tab" data-mode="more">🔮 More</button>
          <button type="button" class="mode-tab" data-mode="api">🔑 API</button>
          <button type="button" class="mode-tab" data-mode="feed">📰 Feed</button>
        </nav>
        <form id="filter-form" class="filterbar">
          <span>🔍 Filters</span>
          <label>
            Status
            <select id="status-filter" name="status">
              <option value="all">All</option>
              <option value="todo">Todo</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
            </select>
          </label>
          <label>
            Priority
            <select id="priority-filter" name="priority">
              <option value="all">All</option>
              <option value="urgent">Urgent</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label>
            Project
            <select id="project-filter" name="project"></select>
          </label>
        </form>
      </header>

      <main class="layout">
        <aside class="panel sidebar">
          <div class="panel-header">
            <h2>Projects</h2>
            <span id="project-count" class="badge">0</span>
          </div>
          <div id="project-list" class="stack"></div>

          <section class="subpanel mode-panel" data-panel="projects">
            <div class="panel-header">
              <h3>Create project</h3>
            </div>
            <form id="project-form" class="form stack-tight">
              <label>
                Name
                <input name="name" required placeholder="design-system" />
              </label>
              <label>
                Description
                <textarea name="description" rows="3" placeholder="Shared dashboard workstream"></textarea>
              </label>
              <button type="submit">Add project</button>
            </form>
          </section>
        </aside>

        <section class="panel main">
          <div class="stats" id="stats"></div>

          <section class="subpanel mode-panel" data-panel="find">
            <div class="panel-header">
              <h2>Search and capture</h2>
            </div>
            <form id="search-form" class="search-row">
              <input id="search-input" name="q" placeholder="Search tasks or text" />
              <button type="submit">Search</button>
              <button id="clear-search" type="button" class="secondary">Clear</button>
            </form>
          </section>

          <section class="subpanel mode-panel" data-panel="tasks projects">
            <div class="panel-header">
              <h2>Quick task</h2>
            </div>
            <form id="task-form" class="form task-form">
              <label class="wide">
                Action
                <input name="action" required placeholder="Finalize Telegram bot config" />
              </label>
              <label>
                Project
                <select name="parent_project" id="task-project"></select>
              </label>
              <label>
                Time
                <input name="time" placeholder="ASAP or 2026-05-13T12:00:00Z" />
              </label>
              <label>
                Priority
                <select name="priority">
                  <option value="low">low</option>
                  <option value="medium" selected>medium</option>
                  <option value="high">high</option>
                  <option value="urgent">urgent</option>
                </select>
              </label>
              <div class="actions">
                <button type="submit">Create task</button>
              </div>
            </form>
          </section>

          <section class="subpanel mode-panel" data-panel="more feed">
            <div class="panel-header">
              <h2>Platform capture</h2>
            </div>
            <div class="capture-grid">
              <form id="idea-form" class="form stack-tight">
                <h3>Idea</h3>
                <label>
                  Idea
                  <textarea name="idea" rows="3" required placeholder="Park the thing before it disappears"></textarea>
                </label>
                <div class="row">
                  <label>
                    Importance
                    <select name="importance">
                      <option value="low">low</option>
                      <option value="medium" selected>medium</option>
                      <option value="high">high</option>
                    </select>
                  </label>
                  <label>
                    Share
                    <select name="share">
                      <option value="private" selected>private</option>
                      <option value="team">team</option>
                      <option value="public">public</option>
                    </select>
                  </label>
                </div>
                <label>
                  Tags
                  <input name="tags" placeholder="repo, phone, later" />
                </label>
                <button type="submit">Save idea</button>
              </form>

              <form id="memory-form" class="form stack-tight">
                <h3>Memory</h3>
                <label>
                  Moment
                  <textarea name="moment" rows="2" required></textarea>
                </label>
                <label>
                  Meaning
                  <textarea name="meaning" rows="2" required></textarea>
                </label>
                <label>
                  Reason
                  <input name="reason" required placeholder="why this matters later" />
                </label>
                <div class="row">
                  <label>
                    Type
                    <select name="memory_type">
                      <option value="standard" selected>standard</option>
                      <option value="human">human</option>
                      <option value="secret">secret</option>
                      <option value="emotional">emotional</option>
                    </select>
                  </label>
                  <label>
                    Term
                    <select name="term">
                      <option value="short" selected>short</option>
                      <option value="long">long</option>
                    </select>
                  </label>
                </div>
                <button type="submit">Save memory</button>
              </form>

              <form id="error-form" class="form stack-tight">
                <h3>Error</h3>
                <label>
                  Title
                  <input name="title" required />
                </label>
                <label>
                  Description
                  <textarea name="description" rows="3" required></textarea>
                </label>
                <div class="row">
                  <label>
                    Source
                    <input name="source" required placeholder="repo, service, command" />
                  </label>
                  <label>
                    Severity
                    <select name="severity">
                      <option value="low">low</option>
                      <option value="medium" selected>medium</option>
                      <option value="high">high</option>
                      <option value="critical">critical</option>
                    </select>
                  </label>
                </div>
                <button type="submit">Log error</button>
              </form>

              <form id="queue-form" class="form stack-tight">
                <h3>Queue plan</h3>
                <label>
                  Task name
                  <input name="task_name" required />
                </label>
                <label>
                  Description
                  <textarea name="task_description" rows="3" required></textarea>
                </label>
                <div class="row">
                  <label>
                    Priority
                    <select name="priority">
                      <option value="low">low</option>
                      <option value="medium" selected>medium</option>
                      <option value="high">high</option>
                    </select>
                  </label>
                  <label>
                    Project ID
                    <input name="project_id" placeholder="optional" />
                  </label>
                </div>
                <button type="submit">Plan queue item</button>
              </form>

              <form id="training-form" class="form stack-tight">
                <h3>Training data</h3>
                <label>
                  Prompt
                  <textarea name="prompt" rows="3" required></textarea>
                </label>
                <label>
                  Completion
                  <textarea name="completion" rows="3" required></textarea>
                </label>
                <div class="row">
                  <label>
                    Type
                    <select name="data_type">
                      <option value="instruction" selected>instruction</option>
                      <option value="conversation">conversation</option>
                      <option value="correction">correction</option>
                    </select>
                  </label>
                  <label>
                    Source
                    <input name="source" value="manual" />
                  </label>
                </div>
                <button type="submit">Save training pair</button>
              </form>
            </div>
          </section>

          <section class="subpanel mode-panel" data-panel="tasks done find projects">
            <div class="panel-header">
              <h2>Tasks</h2>
              <span id="task-count" class="badge">0</span>
            </div>
            <div class="task-toolbar">
              <span id="filter-chip" class="chip">All projects</span>
              <span id="search-chip" class="chip hidden"></span>
            </div>
            <div id="task-list" class="task-list"></div>
          </section>

          <section class="subpanel mode-panel" data-panel="more api feed">
            <div class="panel-header">
              <h2>Platform resources</h2>
              <span id="platform-count" class="badge">0</span>
            </div>
            <div id="platform-tabs" class="resource-tabs"></div>
            <div id="platform-list" class="resource-list"></div>
          </section>
        </section>

        <aside class="panel detail">
          <div id="task-detail" class="detail-empty">
            Pick a task to inspect or edit it.
          </div>
        </aside>
      </main>
    </div>
  </body>
</html>
